services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gastrorank
      POSTGRES_USER: gastrorank
      POSTGRES_PASSWORD: gastrorank
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init.postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastrorank -d gastrorank"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gastrorank:gastrorank@db:5432/gastrorank
      PORT: 3030
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3030:3030"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
